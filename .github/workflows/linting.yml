name: Linting + Build
run-name: ${{ github.actor }} Linting pipeline
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  linting:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 24.x]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Get file changes
        id: get_file_changes
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: ' '
      
      - name: Filter changed files
        id: filter_files
        run: |
          # Filter only JS/TS files for ESLint
          ESLINT_FILES=""
          for file in ${{ steps.get_file_changes.outputs.files_added }} ${{ steps.get_file_changes.outputs.files_modified }}; do
            if [[ $file =~ \.(js|jsx|ts|tsx)$ ]]; then
              ESLINT_FILES="$ESLINT_FILES $file"
            fi
          done
          echo "eslint_files=$ESLINT_FILES" >> $GITHUB_OUTPUT
          
          # Filter only SCSS files for StyleLint
          STYLELINT_FILES=""
          for file in ${{ steps.get_file_changes.outputs.files_added }} ${{ steps.get_file_changes.outputs.files_modified }}; do
            if [[ $file =~ \.scss$ ]]; then
              STYLELINT_FILES="$STYLELINT_FILES $file"
            fi
          done
          echo "stylelint_files=$STYLELINT_FILES" >> $GITHUB_OUTPUT
      
      - name: Echo file changes
        run: |
          echo "ESLint files: ${{ steps.filter_files.outputs.eslint_files }}"
          echo "StyleLint files: ${{ steps.filter_files.outputs.stylelint_files }}"
      
      - name: ESLint Checking
        if: ${{ always() && steps.filter_files.outputs.eslint_files != '' }}
        run: npm run lint -- ${{ steps.filter_files.outputs.eslint_files }} --fix
      
      - name: StyleLint Checking
        if: ${{ always() && steps.filter_files.outputs.stylelint_files != '' }}
        run: npm run stylelint:fix -- ${{ steps.filter_files.outputs.stylelint_files }}
      
      - name: TypeScript checking and build
        if: ${{ always() }}
        run: npm run build
      
      - name: Commit changes
        if: ${{ always() && (steps.filter_files.outputs.eslint_files != '' || steps.filter_files.outputs.stylelint_files != '') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply linting and formatting changes"
          file_pattern: "*.{js,jsx,ts,tsx,scss}"